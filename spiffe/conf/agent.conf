agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    trust_domain = "demo.ingen.lab"

    # Demo-only: skip bundle verification on first connect to the server.
    # Production deployments bootstrap with a real trust bundle instead.
    insecure_bootstrap = true
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Workload attestation by Unix process attributes (UID). The demo
    # workload runs as UID 1001 inside the agent container.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
