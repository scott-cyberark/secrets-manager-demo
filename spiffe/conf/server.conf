server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "demo.ingen.lab"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"

    # Conjur Cloud's JWT authenticator accepts RSA-signed tokens only,
    # so force the CA (and therefore JWT-SVID signing) onto RSA.
    ca_key_type = "rsa-2048"

    # Included as the "iss" claim in JWT-SVIDs; must match the
    # authenticator's issuer variable in Secrets Manager.
    jwt_issuer = "https://spire.demo.ingen.lab"

    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}
