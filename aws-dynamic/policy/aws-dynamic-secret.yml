# AWS dynamic secret: each fetch mints fresh, short-lived STS credentials.
# Nothing long-lived is ever handed to the workload.
# Load into branch: data/dynamic
#   conjur policy load -b data/dynamic -f policy/aws-dynamic-secret.yml
- !variable
  id: demo-s3-reader
  annotations:
    dynamic/issuer: aws-demo-issuer
    dynamic/method: federation-token
    dynamic/ttl: 900
    # Least privilege: the minted credentials can list S3 buckets, nothing else.
    dynamic/inline-policy: |-
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:ListAllMyBuckets"],
            "Resource": "*"
          }
        ]
      }
