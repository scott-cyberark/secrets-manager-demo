# Static secrets holding the issuer IAM user's access key. The issuer
# references these by secret ID; in production these would be synced from
# a PAM safe and rotated by CPM.
# Load into branch: data/demo-apps
#   conjur policy load -b data/demo-apps -f policy/issuer-secrets.yml
- !policy
  id: aws-issuer
  body:
    - !variable access-key-id
    - !variable secret-access-key
